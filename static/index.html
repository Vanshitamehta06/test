<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page For Password Reset — Sign in</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="brand">
      <div class="logo" aria-hidden="true">P</div>
      <h1>Page For Password Reset</h1>
      <p>Sign in to continue.</p>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="login" role="tab" aria-selected="true">Sign in</button>
        <button type="button" class="tab" data-mode="register" role="tab" aria-selected="false">Create account</button>
      </div>

      <form id="auth-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <p class="field-error" data-for="email"></p>

        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required />
          <button type="button" id="toggle-password" aria-label="Show password">Show</button>
        </div>
        <p class="field-error" data-for="password"></p>

        <button type="submit" id="submit">Sign in</button>
        <p id="message" role="status"></p>
      </form>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
